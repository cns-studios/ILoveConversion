x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-log-retention: &log-retention
  ilc.log-retention: "true"

x-app-env: &app-env
  API_PORT: ${API_PORT:-3015}
  MAX_FILE_SIZE: ${MAX_FILE_SIZE:-524288000}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-ilc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:-ilc}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?}
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-}
  ENCRYPTION_OLD_KEYS: ${ENCRYPTION_OLD_KEYS:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
  DRAIN_TIMEOUT_SECONDS: ${DRAIN_TIMEOUT_SECONDS:-120}
  RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-600}
  FLAG_THRESHOLD: ${FLAG_THRESHOLD:-5000}
  CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-5}
  FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  REMBG_URL: http://rembg:5000
  TIMEOUT_IMAGE_CONVERT: ${TIMEOUT_IMAGE_CONVERT:-120}
  TIMEOUT_IMAGE_COMPRESS: ${TIMEOUT_IMAGE_COMPRESS:-120}
  TIMEOUT_IMAGE_REMOVE_BG: ${TIMEOUT_IMAGE_REMOVE_BG:-180}
  TIMEOUT_PDF_COMPRESS: ${TIMEOUT_PDF_COMPRESS:-300}
  TIMEOUT_AUDIO_CONVERT: ${TIMEOUT_AUDIO_CONVERT:-300}
  TIMEOUT_AUDIO_COMPRESS: ${TIMEOUT_AUDIO_COMPRESS:-300}
  TIMEOUT_VIDEO_COMPRESS: ${TIMEOUT_VIDEO_COMPRESS:-1800}
  RETRY_IMAGE: ${RETRY_IMAGE:-2}
  RETRY_PDF: ${RETRY_PDF:-2}
  RETRY_AUDIO: ${RETRY_AUDIO:-2}
  RETRY_VIDEO: ${RETRY_VIDEO:-1}

services:
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["./api", "--migrate-only"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging
    labels: *log-retention

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *app-env
    ports:
      - "${PORT:-5823}:${API_PORT:-3015}"
    volumes:
      - file_storage:/app/storage
    tmpfs:
      - /tmp:size=${API_TMPFS_SIZE:-1g},mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment: *app-env
    stop_grace_period: 150s
    volumes:
      - file_storage:/app/storage
    tmpfs:
      - /tmp/processing:size=${TMPFS_SIZE:-1g},mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      rembg:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  rembg:
    build:
      context: .
      dockerfile: docker/rembg.Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-ilc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  log-janitor:
    build:
      context: .
      dockerfile: docker/log-janitor.Dockerfile
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/containers
    network_mode: none
    restart: unless-stopped
    logging: *logging

volumes:
  file_storage:
  postgres_data:
