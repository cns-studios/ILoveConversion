x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Every service below is labelled for the log-janitor, which deletes log entries older
# than LOG_RETENTION_DAYS (default 7). Docker's max-size/max-file only limit size.
x-log-retention: &log-retention
  ilc.log-retention: "true"

services:

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    env_file: .env
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    logging: *logging
    labels: *log-retention
    networks:
      - ilc

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    volumes:
      - file_storage:/app/storage
    # Large uploads are buffered here before they are encrypted; keep that in RAM, not on disk.
    tmpfs:
      - /tmp:size=${API_TMPFS_SIZE:-1g},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    labels: *log-retention
    networks:
      - ilc

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    volumes:
      - file_storage:/app/storage
    tmpfs:
      - /tmp/processing:size=${TMPFS_SIZE:-1g},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rembg:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    labels: *log-retention
    networks:
      - ilc

  rembg:
    build:
      context: .
      dockerfile: docker/rembg.Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    labels: *log-retention
    networks:
      - ilc

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    logging: *logging
    labels: *log-retention
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ilc

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ilc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    logging: *logging
    labels: *log-retention
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ilc

  log-janitor:
    image: alpine:3.20
    command: ["sh", "/janitor.sh"]
    environment:
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
    volumes:
      - ./docker/log-janitor.sh:/janitor.sh:ro
      # Docker's json-file logs live here on a standard Linux host.
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/containers
    network_mode: none
    restart: unless-stopped
    logging: *logging

volumes:
  file_storage:
  redis_data:
  postgres_data:

networks:
  ilc:
    driver: bridge