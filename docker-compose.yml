x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-log-retention: &log-retention
  ilc.log-retention: "true"

x-app-env: &app-env
  API_PORT: ${API_PORT:-3015}
  MAX_FILE_SIZE: ${MAX_FILE_SIZE:-524288000}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-ilc}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:-ilc}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?}
  RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-600}
  FLAG_THRESHOLD: ${FLAG_THRESHOLD:-5000}
  CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-5}
  FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  REMBG_URL: http://rembg:5000
  TIMEOUT_IMAGE_CONVERT: ${TIMEOUT_IMAGE_CONVERT:-120}
  TIMEOUT_IMAGE_COMPRESS: ${TIMEOUT_IMAGE_COMPRESS:-120}
  TIMEOUT_IMAGE_REMOVE_BG: ${TIMEOUT_IMAGE_REMOVE_BG:-180}
  TIMEOUT_PDF_COMPRESS: ${TIMEOUT_PDF_COMPRESS:-300}
  TIMEOUT_AUDIO_CONVERT: ${TIMEOUT_AUDIO_CONVERT:-300}
  TIMEOUT_AUDIO_COMPRESS: ${TIMEOUT_AUDIO_COMPRESS:-300}
  TIMEOUT_VIDEO_COMPRESS: ${TIMEOUT_VIDEO_COMPRESS:-1800}
  RETRY_IMAGE: ${RETRY_IMAGE:-2}
  RETRY_PDF: ${RETRY_PDF:-2}
  RETRY_AUDIO: ${RETRY_AUDIO:-2}
  RETRY_VIDEO: ${RETRY_VIDEO:-1}

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      API_PORT: ${API_PORT:-3015}
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-510m}
    ports:
      - "${NGINX_PORT:-5823}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *app-env
    volumes:
      - file_storage:/app/storage
    tmpfs:
      - /tmp:size=${API_TMPFS_SIZE:-1g},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment: *app-env
    volumes:
      - file_storage:/app/storage
    tmpfs:
      - /tmp/processing:size=${TMPFS_SIZE:-1g},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rembg:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  rembg:
    build:
      context: .
      dockerfile: docker/rembg.Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-ilc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    labels: *log-retention

  log-janitor:
    build:
      context: .
      dockerfile: docker/log-janitor.Dockerfile
    environment:
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/containers
    network_mode: none
    restart: unless-stopped
    logging: *logging

volumes:
  file_storage:
  redis_data:
  postgres_data:
