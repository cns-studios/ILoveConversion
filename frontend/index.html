<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILoveConversion - File Conversion & Compression</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#09090b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
    <script src="/qrcode.min.js"></script>
</head>
<body>
    <div id="app">

        <header class="site-header">
            <a href="/" class="brand" aria-label="ILoveConversion home">
                <img class="brand-logo" src="/logo.png" alt="" width="46" height="46">
                <span class="brand-name">ILC</span>
            </a>
            <div class="mode-toggle" role="group" aria-label="Processing mode">
                <button type="button" class="mode-btn" data-mode="local">Local</button>
                <button type="button" class="mode-btn active" data-mode="online" aria-pressed="true">Online</button>
            </div>
        </header>

        <main class="workspace">

            <nav class="tool-tabs" role="tablist">
                <button class="tab active" data-tool="convert" role="tab" aria-selected="true">
                    <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.25 10.25C19.25 7.86305 18.3018 5.57387 16.614 3.88604C14.9261 2.19821 12.6369 1.25 10.25 1.25C7.73395 1.25947 5.31897 2.24122 3.51 3.99L1.25 6.25M6.25 6.25H1.25V1.25M1.25 10.25C1.25 12.6369 2.19821 14.9261 3.88604 16.614C5.57387 18.3018 7.86305 19.25 10.25 19.25C12.766 19.2405 15.181 18.2588 16.99 16.51L19.25 14.25M19.25 19.25V14.25H14.25"/></svg>
                    <span>Convert</span>
                </button>
                <button class="tab" data-tool="compress" role="tab" aria-selected="false">
                    <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10L21 3M14 4V10H20M3 21L10 14M10 20V14H4"/></svg>
                    <span>Compress</span>
                </button>
                <button class="tab" data-tool="create" role="tab" aria-selected="false">
                    <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H19M12 5V19"/></svg>
                    <span>Create</span>
                </button>
            </nav>

            <section id="panel-convert" class="tool-panel" data-panel="convert" role="tabpanel"></section>
            <section id="panel-compress" class="tool-panel hidden" data-panel="compress" role="tabpanel"></section>

            <section id="panel-create" class="tool-panel hidden" data-panel="create" role="tabpanel">
                <div class="option-row">
                    <label class="option-label" for="qr-type">Create</label>
                    <select class="option-select" id="qr-type">
                        <option value="url">QR Code · URL</option>
                        <option value="text">QR Code · Text</option>
                        <option value="location">QR Code · Location</option>
                        <option value="wifi">QR Code · WiFi</option>
                    </select>
                </div>

                <div class="card qr-fields-card">
                    <div id="qr-url-fields" class="qr-fields">
                        <div class="field">
                            <label class="field-label" for="qr-url-input">URL</label>
                            <input type="text" id="qr-url-input" class="text-input" placeholder="https://example.com" />
                        </div>
                    </div>

                    <div id="qr-text-fields" class="qr-fields hidden">
                        <div class="field">
                            <label class="field-label" for="qr-text-input">Text</label>
                            <textarea id="qr-text-input" class="text-input text-area" placeholder="Enter text to encode" rows="4"></textarea>
                        </div>
                    </div>

                    <div id="qr-location-fields" class="qr-fields hidden">
                        <div class="field">
                            <label class="field-label" for="qr-location-search">Search location</label>
                            <input type="text" id="qr-location-search" class="text-input" placeholder="e.g., New York, Times Square" />
                            <div id="qr-search-results" class="search-results hidden"></div>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <label class="field-label" for="qr-latitude-input">Latitude</label>
                                <input type="number" id="qr-latitude-input" class="text-input" placeholder="0.0" step="0.0001" />
                            </div>
                            <div class="field">
                                <label class="field-label" for="qr-longitude-input">Longitude</label>
                                <input type="number" id="qr-longitude-input" class="text-input" placeholder="0.0" step="0.0001" />
                            </div>
                        </div>
                    </div>

                    <div id="qr-wifi-fields" class="qr-fields hidden">
                        <div class="field">
                            <label class="field-label" for="qr-wifi-ssid">Network name (SSID)</label>
                            <input type="text" id="qr-wifi-ssid" class="text-input" placeholder="WiFi network name" />
                        </div>
                        <div class="field">
                            <label class="field-label" for="qr-wifi-password">Password</label>
                            <input type="password" id="qr-wifi-password" class="text-input" placeholder="WiFi password" />
                        </div>
                        <label class="switch-row" for="qr-wifi-hidden">
                            <span class="switch-label">Hidden network</span>
                            <input type="checkbox" class="switch" id="qr-wifi-hidden">
                        </label>
                    </div>
                </div>

                <div id="qr-output-section" class="card qr-output hidden">
                    <div id="qr-result-canvas"></div>
                    <button id="btn-download-qr" type="button" class="btn-chip">
                        Download
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.25V2.25M12.75 7.5L9 11.25L5.25 7.5M15.75 11.25V14.25C15.75 14.6478 15.592 15.0294 15.3107 15.3107C15.0294 15.592 14.6478 15.75 14.25 15.75H3.75C3.35218 15.75 2.97064 15.592 2.68934 15.3107C2.40804 15.0294 2.25 14.6478 2.25 14.25V11.25"/></svg>
                    </button>
                </div>
            </section>

        </main>

        <footer class="site-footer">
            <a href="/terms.html">Terms of Service</a>
            <a href="/privacy.html">Privacy Policy</a>
            <a href="/privacy.html#data-processing">Data Processing</a>
        </footer>

    </div>

    <template id="tpl-file-tool">
        <div class="dropzone" data-ref="dropzone">
            <p class="dropzone-title">Drop files here</p>
            <button type="button" class="btn-accent" data-ref="browse">Browse files</button>
            <p class="dropzone-formats" data-ref="formats"></p>
        </div>
        <input type="file" class="file-input" data-ref="input" multiple>
        <div class="options hidden" data-ref="options"></div>
        <div class="file-list hidden" data-ref="list"></div>
        <button type="button" class="btn-accent btn-action hidden" data-ref="action"></button>
    </template>

    <div id="alert-modal" class="modal-overlay hidden">
        <div class="modal-content modal-content-small">
            <h2 id="alert-title" class="modal-title">Info</h2>
            <p id="alert-text" class="modal-text"></p>
            <div class="modal-actions">
                <button id="btn-alert-close" class="btn-accent">OK</button>
            </div>
        </div>
    </div>

    <div id="consent-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 class="modal-title">Terms &amp; Privacy</h2>
            <p class="modal-text">
                Welcome to ILoveConversion. Before using our service, please review and accept our
                <a href="/terms.html" target="_blank">Terms of Service</a> and
                <a href="/privacy.html" target="_blank">Privacy Policy</a>.
            </p>
            <div class="modal-actions">
                <button id="btn-decline" class="btn-muted">Decline</button>
                <button id="btn-accept" class="btn-accent">Accept &amp; Continue</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
